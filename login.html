<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>Login — Kainat Tutorials</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="auth.css"><script src="site-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js" defer></script></head>
<body class="auth-page"><div class="auth-shell"><header class="auth-top"><a class="brand" href="index.html"><span class="brand-mark"><img src="logo.svg" alt=""></span><span class="brand-name">Kainat Tutorials<span>from basic to brilliance</span></span></a><a class="auth-back" href="index.html">← Back to website</a></header>
<main class="auth-card"><div class="eyebrow"><span class="eyebrow-line"></span> Student & parent portal</div><h1 id="auth-title">Welcome back.</h1><p id="auth-description">Sign in to access your learning dashboard and purchased resources.</p><div class="auth-tabs" role="tablist"><button type="button" id="login-tab" aria-selected="true">Sign in</button><button type="button" id="signup-tab" aria-selected="false">Create student account</button></div>
<form id="auth-form" class="auth-form"><div id="name-field" class="hidden"><label for="full-name">Student name</label><input id="full-name" name="fullName" autocomplete="name"></div><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required><button class="auth-action primary" id="auth-submit" type="submit">Sign in</button></form><div class="auth-divider"><span>or</span></div><button class="auth-action" id="google-login" type="button">Continue with Google</button><p id="auth-status" class="auth-status" role="status" aria-live="polite"></p><p class="auth-back">For account help, contact Kainat Tutorials on WhatsApp.</p></main></div></body></html>
